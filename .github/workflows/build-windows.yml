name: Build Windows Installed

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/build-windows.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-status:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: node scripts/verify-release-immutability.cjs
      - id: check
        env:
          APPROVED_VERSION: ${{ vars.TV_DRM_PLAYBACK_APPROVED_VERSION }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            if (process.env.GITHUB_EVENT_NAME === 'pull_request' || process.env.GITHUB_REF !== 'refs/heads/main') {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'build=true\n'); return;
            }
            const version = require('./package.json').version;
            if (process.env.APPROVED_VERSION !== version) throw Error('Actual signed playback and Windows recovery acceptance required for this version.');
            const response = await fetch('https://api.github.com/repos/myREWRD/myrewrd-tv-box/releases/tags/latest');
            if (!response.ok) throw Error('Cannot verify immutable release assets.');
            const release = await response.json();
            const names = [`myREWRD.TV.Box.${version}.zip`, `myREWRD.TV.Box.${version}.setup.ps1`];
            const present = names.map(name => release.assets.find(asset => asset.name === name));
            if (present.some(Boolean) && !present.every(Boolean)) throw Error('Partial release exists: complete the reviewed immutable release; do not rebuild or overwrite it.');
            if (present.every(Boolean)) {
              if (present.some(asset => !/^sha256:[a-f0-9]{64}$/i.test(asset.digest || ''))) throw Error('Existing release lacks verified digests.');
              console.log('Accepted immutable assets already published; skipping rebuild and upload.');
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'build=false\n'); return;
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'build=true\n');
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
  build:
    needs: release-status
    if: needs.release-status.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5; Node 24
      
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5; Node 24
        with:
          package-manager-cache: false
          node-version: '24'

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6; Node 24
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          npm install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install castlabs-evs==1.3.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require playback acceptance before release build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          APPROVED_VERSION: ${{ vars.TV_DRM_PLAYBACK_APPROVED_VERSION }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:APPROVED_VERSION -ne $version) { throw 'Actual signed YouTube TV playback and Windows recovery acceptance required before publishing this version.' }
        
      - name: Build installed runtime and migration
        env:
          TV_DRM_DEVELOPMENT_BUILD: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          npm run build:win-installed -- --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/build-installer.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        
      - name: Verify Windows runtime and recovery
        run: |
          node scripts/verify-protected-playback.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-wake-recovery.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-provider-fullscreen.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-provider-resume.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-provider-accounts.cjs
          node scripts/verify-provider-account-form.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-process-identity.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-remote-status.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -File scripts/verify-remote-status.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-installer.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-installed-update.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-installed-retry.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -File scripts/verify-runtime-extraction.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-installed-package.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify provider and sponsor geometry
        run: |
          $fixture = Start-Process -FilePath './node_modules/electron/dist/electron.exe' -ArgumentList 'scripts/verify-game-day-layout-electron.cjs' -WindowStyle Hidden -PassThru -Wait
          if ($fixture.ExitCode -ne 0) { exit 1 }

      - name: Verify real Windows process identity
        run: |
          $fixture = Start-Process -FilePath './node_modules/electron/dist/electron.exe' -ArgumentList 'scripts/verify-process-identity-electron.cjs' -WindowStyle Hidden -PassThru -Wait
          if ($fixture.ExitCode -ne 0) { exit 1 }

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6; Node 24
        with:
          name: myREWRD-TV-Box-Windows
          path: |
            dist/*.zip
            dist/*.setup.ps1

      - name: Upload to Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3; Node 24
        with:
          tag_name: latest
          name: myREWRD TV Box (Latest)
          files: |
            dist/*.zip
            dist/*.setup.ps1
          make_latest: true
          overwrite_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

