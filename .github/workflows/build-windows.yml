name: Build Windows Installed

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/build-windows.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          npm install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install castlabs-evs==1.3.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require playback acceptance before release build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          APPROVED_VERSION: ${{ vars.TV_DRM_PLAYBACK_APPROVED_VERSION }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:APPROVED_VERSION -ne $version) { throw 'Actual signed YouTube TV playback and Windows recovery acceptance required before publishing this version.' }
        
      - name: Build installed runtime and migration
        env:
          TV_DRM_DEVELOPMENT_BUILD: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          npm run build:win-installed -- --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/build-installer.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        
      - name: Verify Windows runtime and recovery
        run: |
          node scripts/verify-protected-playback.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-wake-recovery.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-provider-fullscreen.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-provider-resume.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-provider-accounts.cjs
          node scripts/verify-provider-account-form.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-process-identity.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-remote-status.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -File scripts/verify-remote-status.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-installer.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-installed-update.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-installed-retry.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -File scripts/verify-runtime-extraction.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-installed-package.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify provider and sponsor geometry
        run: |
          $fixture = Start-Process -FilePath './node_modules/electron/dist/electron.exe' -ArgumentList 'scripts/verify-game-day-layout-electron.cjs' -WindowStyle Hidden -PassThru -Wait
          if ($fixture.ExitCode -ne 0) { exit 1 }

      - name: Verify real Windows process identity
        run: |
          $fixture = Start-Process -FilePath './node_modules/electron/dist/electron.exe' -ArgumentList 'scripts/verify-process-identity-electron.cjs' -WindowStyle Hidden -PassThru -Wait
          if ($fixture.ExitCode -ne 0) { exit 1 }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: myREWRD-TV-Box-Windows
          path: |
            dist/*.zip
            dist/*.setup.ps1

      - name: Upload to Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: myREWRD TV Box (Latest)
          files: |
            dist/*.zip
            dist/*.setup.ps1
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
