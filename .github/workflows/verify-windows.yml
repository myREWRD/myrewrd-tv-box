name: Verify Windows Update Recovery
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/verify-windows.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - name: Source regressions
        run: |
          node scripts/verify-live-input-queue.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-remote-restart.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-live-remote.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-game-day-provider.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-game-day-url.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-provider-remote.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-wake-recovery.cjs
          node scripts/verify-provider-fullscreen.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-game-day-ticker.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-gameday-sponsor-logo.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-live-game-takeover.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Chromium provider audio controls
        run: |
          $fixture = Start-Process -FilePath './node_modules/electron/dist/electron.exe' -ArgumentList 'scripts/verify-provider-audio-electron.cjs' -WindowStyle Hidden -PassThru -Wait
          $result = Get-Content ../tv-presentation-validation/provider-audio-electron.json -Raw | ConvertFrom-Json
          $result | ConvertTo-Json -Depth 5
          if ($fixture.ExitCode -ne 0 -or $result.status -ne 'passed') { exit 1 }
      - name: Chromium preview privacy geometry
        run: |
          $fixture = Start-Process -FilePath './node_modules/electron/dist/electron.exe' -ArgumentList 'scripts/verify-preview-geometry-electron.cjs' -WindowStyle Hidden -PassThru -Wait
          $result = Get-Content ../tv-presentation-validation/preview-geometry-electron.json -Raw | ConvertFrom-Json
          $result | ConvertTo-Json -Depth 5
          if ($fixture.ExitCode -ne 0 -or $result.status -ne 'passed') { exit 1 }
      - name: Windows process failure recovery
        run: |
          node scripts/verify-update.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-attended-profile.cjs
      - name: Build isolated portable test applications
        run: node scripts/build-packaged-fixtures.cjs "${{ runner.temp }}/tv-fixtures"
      - name: Portable upgrade with persistent profile
        run: node scripts/verify-packaged-upgrade.cjs "${{ runner.temp }}/tv-fixtures" --gameday
      - name: Portable rollback after board failure
        run: node scripts/verify-packaged-upgrade.cjs "${{ runner.temp }}/tv-fixtures" --fail-candidate
      - name: Portable recovery after supervisor termination
        run: node scripts/verify-packaged-upgrade.cjs "${{ runner.temp }}/tv-fixtures" --kill-supervisor
      - name: Build unpublished development candidate
        env:
          TV_DRM_DEVELOPMENT_BUILD: '1'
        run: npm run build:win-installed -- --publish never
      - name: Normal Electron physical runtime files
        run: node scripts/verify-runtime-files.cjs
      # Legacy 1.0.4 handoff was reproduced as failing in runs 34383299598 and
      # 34384292590. It is deliberately unsupported and API-blocked: those boxes
      # require attended repair. Keep the standalone reproducer for diagnosis;
      # this workflow verifies the supported 1.0.5+ update/recovery path.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-update-verification
          path: |
            ${{ runner.temp }}/tv-fixtures/run-*/**/*.json
            ${{ runner.temp }}/tv-fixtures/run-*/**/*.log
            dist/*.zip
