name: Verify Windows Update Recovery
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/verify-windows.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5; Node 24
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5; Node 24
        with:
          package-manager-cache: false
          node-version: '24'
      - run: npm install
      - name: Source regressions
        run: |
          node scripts/verify-provider-user-agent.cjs
          node scripts/verify-wifi-setup.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-provider-display-status.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-provider-text-editing.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-private-signin.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-provider-accounts.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-live-input-queue.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-remote-restart.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-live-remote.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-game-day-provider.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-game-day-url.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-provider-remote.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-provider-display-status.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-wake-recovery.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-provider-fullscreen.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-provider-resume.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-process-identity.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-game-day-ticker.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-gameday-sponsor-logo.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-live-game-takeover.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify provider and sponsor geometry
        run: |
          $fixture = Start-Process -FilePath './node_modules/electron/dist/electron.exe' -ArgumentList 'scripts/verify-game-day-layout-electron.cjs' -WindowStyle Hidden -PassThru -Wait
          if ($fixture.ExitCode -ne 0) { exit 1 }

      - name: Verify private sign-in screen and keyboard
        run: |
          $privateResult = Join-Path $env:RUNNER_TEMP 'private-signin-result.json'
          $fixture = Start-Process -FilePath './node_modules/electron/dist/electron.exe' -ArgumentList @('scripts/verify-private-signin-electron.cjs', ('"' + $privateResult + '"')) -WindowStyle Hidden -PassThru -Wait
          $result = Get-Content -LiteralPath $privateResult -Raw | ConvertFrom-Json
          Write-Output ("Private fixture exit: " + $fixture.ExitCode)
          Write-Output ($result | ConvertTo-Json -Compress)
          if ($fixture.ExitCode -ne 0 -or $result.ok -ne $true) { exit 1 }

      - name: Verify live search editing
        run: |
          $searchResult = Join-Path $env:RUNNER_TEMP 'search-editing-result.json'
          $fixture = Start-Process -FilePath './node_modules/electron/dist/electron.exe' -ArgumentList @('scripts/verify-search-editing-electron.cjs', ('"' + $searchResult + '"')) -WindowStyle Hidden -PassThru -Wait
          $result = Get-Content -LiteralPath $searchResult -Raw | ConvertFrom-Json
          Write-Output ($result | ConvertTo-Json -Compress)
          if ($fixture.ExitCode -ne 0 -or $result.ok -ne $true) { exit 1 }

      - name: Verify provider browser identity
        run: |
          $agentResult = Join-Path $env:RUNNER_TEMP 'provider-agent-result.json'
          $fixture = Start-Process -FilePath './node_modules/electron/dist/electron.exe' -ArgumentList @('scripts/verify-provider-user-agent-electron.cjs', ('"' + $agentResult + '"')) -WindowStyle Hidden -PassThru -Wait
          $result = Get-Content -LiteralPath $agentResult -Raw | ConvertFrom-Json
          Write-Output ($result | ConvertTo-Json -Compress)
          if ($fixture.ExitCode -ne 0 -or $result.ok -ne $true) { exit 1 }

      - name: Verify real Windows process identity
        run: |
          $fixture = Start-Process -FilePath './node_modules/electron/dist/electron.exe' -ArgumentList 'scripts/verify-process-identity-electron.cjs' -WindowStyle Hidden -PassThru -Wait
          if ($fixture.ExitCode -ne 0) { exit 1 }

      - name: Chromium provider audio controls
        run: |
          $fixture = Start-Process -FilePath './node_modules/electron/dist/electron.exe' -ArgumentList 'scripts/verify-provider-audio-electron.cjs' -WindowStyle Hidden -PassThru -Wait
          $result = Get-Content ../tv-presentation-validation/provider-audio-electron.json -Raw | ConvertFrom-Json
          $result | ConvertTo-Json -Depth 5
          if ($fixture.ExitCode -ne 0 -or $result.status -ne 'passed') { exit 1 }
      - name: Chromium preview privacy geometry
        run: |
          $fixture = Start-Process -FilePath './node_modules/electron/dist/electron.exe' -ArgumentList 'scripts/verify-preview-geometry-electron.cjs' -WindowStyle Hidden -PassThru -Wait
          $result = Get-Content ../tv-presentation-validation/preview-geometry-electron.json -Raw | ConvertFrom-Json
          $result | ConvertTo-Json -Depth 5
          if ($fixture.ExitCode -ne 0 -or $result.status -ne 'passed') { exit 1 }
      - name: Windows process failure recovery
        run: |
          node scripts/verify-update.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-attended-profile.cjs
      - name: Build isolated portable test applications
        run: node scripts/build-packaged-fixtures.cjs "${{ runner.temp }}/tv-fixtures"
      - name: Portable upgrade with persistent profile
        run: node scripts/verify-packaged-upgrade.cjs "${{ runner.temp }}/tv-fixtures" --gameday
      - name: Portable rollback after board failure
        run: node scripts/verify-packaged-upgrade.cjs "${{ runner.temp }}/tv-fixtures" --fail-candidate
      - name: Portable recovery after supervisor termination
        run: node scripts/verify-packaged-upgrade.cjs "${{ runner.temp }}/tv-fixtures" --kill-supervisor
      - name: Build unpublished development candidate
        env:
          TV_DRM_DEVELOPMENT_BUILD: '1'
        run: npm run build:win-installed -- --publish never
      - name: Normal Electron physical runtime files
        run: node scripts/verify-runtime-files.cjs
      # Legacy 1.0.4 handoff was reproduced as failing in runs 34383299598 and
      # 34384292590. It is deliberately unsupported and API-blocked: those boxes
      # require attended repair. Keep the standalone reproducer for diagnosis;
      # this workflow verifies the supported 1.0.5+ update/recovery path.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6; Node 24
        if: always()
        with:
          name: windows-update-verification
          path: |
            ${{ runner.temp }}/tv-fixtures/run-*/**/*.json
            ${{ runner.temp }}/tv-fixtures/run-*/**/*.log
            dist/*.zip

