<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 320px; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; }
    h1 { font-size: 16px; font-weight: 700; margin-bottom: 4px; color: #fbbf24; }
    .subtitle { font-size: 11px; color: #64748b; margin-bottom: 16px; }
    label { display: block; font-size: 11px; font-weight: 600; color: #94a3b8; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    input { width: 100%; padding: 8px 12px; border: 1px solid #334155; border-radius: 8px; background: #1e293b; color: #e2e8f0; font-size: 13px; margin-bottom: 12px; outline: none; }
    input:focus { border-color: #fbbf24; }
    button { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; background: #fbbf24; color: #0f172a; }
    button:hover { background: #f59e0b; }
    .status { margin-top: 12px; padding: 8px 12px; border-radius: 8px; font-size: 12px; text-align: center; }
    .status.connected { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); color: #10b981; }
    .mode-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-top: 8px; }
    .mode-regular { background: rgba(6, 182, 212, 0.2); color: #06b6d4; }
    .mode-stream { background: rgba(168, 85, 247, 0.2); color: #a855f7; }
    .mode-gameday { background: rgba(251, 191, 36, 0.2); color: #fbbf24; }
  </style>
</head>
<body>
  <h1>🏈 myREWRD Game Day</h1>
  <p class="subtitle">Sponsor overlay for venue TV boxes</p>
  <label>TV Token</label>
  <input type="text" id="token" placeholder="tv_xxxxxxxxxxxxxxxx" />
  <button id="save">Save & Connect</button>
  <div id="status" class="status" style="display:none"></div>
  <div id="mode" style="text-align:center"></div>
  <script src="popup.js"></script>
</body>
</html>
