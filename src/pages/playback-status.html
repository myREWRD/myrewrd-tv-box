<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preparing Game Day</title>
<style>
html,body{height:100%;margin:0;background:#080d18;color:#eef2ff;font-family:system-ui,sans-serif}
body{display:grid;place-items:center;text-align:center}main{max-width:42rem;padding:3rem}
h1{font-size:2.3rem}p{color:#b5c0d5;font-size:1.25rem;line-height:1.6}.retry{display:none}
body:has(#retry:target) .preparing{display:none}#retry:target{display:block}
</style></head><body><main>
<section class="preparing"><h1>Preparing Game Day</h1><p>Getting the video player ready. This can take a moment the first time.</p></section>
<section class="retry" id="retry"><h1>Game Day is reconnecting</h1><p>The video player couldn’t get ready. We’ll try again automatically. You can return to the TV Board from TV Control.</p></section>
</main></body></html>
