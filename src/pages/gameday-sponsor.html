<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Day — Sponsor Bar</title>
  <link rel="stylesheet" href="game-day-strip.css">
  <style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#000}body{display:flex;flex-direction:column;justify-content:flex-end}</style>
</head>
<body>
  <div class="gd-strip" aria-label="Game Day sponsor and venue messages">
    <div class="gd-lane" id="ticker"></div>
    <div class="gd-sponsor">
      <span class="gd-label">Live Game Sponsored by</span>
      <img class="gd-logo" id="sponsorLogo" alt="" style="display:none" />
      <span class="gd-name" id="sponsorName">Sponsor</span>
    </div>
  </div>
  <script src="game-day-ticker.js"></script>
  <script>
    let sponsorRenderVersion = 0;

    function loadSponsorLogo(logo, logoUrls, renderVersion, index = 0) {
      if (renderVersion !== sponsorRenderVersion) return;
      if (index >= logoUrls.length) {
        logo.removeAttribute('src');
        logo.style.display = 'none';
        return;
      }

      const probe = new Image();
      probe.onload = () => {
        if (renderVersion !== sponsorRenderVersion) return;
        logo.src = logoUrls[index];
        logo.style.display = 'block';
      };
      probe.onerror = () => {
        loadSponsorLogo(logo, logoUrls, renderVersion, index + 1);
      };
      probe.src = logoUrls[index];
    }

    function applySponsor(sponsor) {
      if (!sponsor) return;
      const renderVersion = ++sponsorRenderVersion;
      document.getElementById('sponsorName').textContent = sponsor.name;
      const logo = document.getElementById('sponsorLogo');
      logo.alt = sponsor.name ? `${sponsor.name} logo` : '';
      logo.removeAttribute('src');
      logo.style.display = 'none';
      const logoUrls = [sponsor.logoUrlCompact, sponsor.logoUrlMedium, sponsor.logoUrl]
        .filter((value, index, values) => Boolean(value) && values.indexOf(value) === index);
      loadSponsorLogo(logo, logoUrls, renderVersion);
    }

    async function loadSponsor() {
      try {
        const sponsor = await window.tvBox.getSponsor();
        applySponsor(sponsor);
      } catch (e) {
        console.error('Failed to load sponsor:', e);
      }
    }

    // Load immediately
    loadSponsor();

    // Listen for updates from main process
    window.tvBox.onSponsorUpdate((sponsor) => {
      applySponsor(sponsor);
    });
  </script>
</body>
</html>
