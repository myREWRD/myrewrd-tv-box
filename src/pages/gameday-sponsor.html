<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Day — Sponsor Bar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    /* The stream BrowserView sits on top (94% of screen) — this page only renders the bottom 6% */
    .sponsor-bar {
      height: 6vh;
      background: linear-gradient(180deg, #0f172a 0%, #020617 100%);
      border-top: 1px solid rgba(251, 191, 36, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 3vw;
      gap: 2vw;
    }
    .sponsor-bar .game-icon {
      font-size: 2.2vh;
    }
    .sponsor-bar .label {
      font-size: 1.8vh;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .sponsor-bar .sponsor-name {
      font-size: 2.4vh;
      font-weight: 900;
      color: #fbbf24;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .sponsor-bar .sponsor-logo {
      height: 4vh;
      width: auto;
      object-fit: contain;
      border-radius: 4px;
    }
    .sponsor-bar .divider {
      width: 1px;
      height: 60%;
      background: rgba(148, 163, 184, 0.3);
    }
    /* Subtle glow animation on sponsor name */
    @keyframes sponsorGlow {
      0%, 100% { text-shadow: 0 0 8px rgba(251, 191, 36, 0.3); }
      50% { text-shadow: 0 0 16px rgba(251, 191, 36, 0.6); }
    }
    .sponsor-bar .sponsor-name {
      animation: sponsorGlow 4s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div class="sponsor-bar">
    <span class="game-icon">🏈</span>
    <span class="label">Live Game Sponsored by</span>
    <div class="divider"></div>
    <img class="sponsor-logo" id="sponsorLogo" src="" alt="" style="display:none" />
    <span class="sponsor-name" id="sponsorName">Loading...</span>
  </div>

  <script>
    async function loadSponsor() {
      try {
        const sponsor = await window.tvBox.getSponsor();
        if (sponsor) {
          document.getElementById('sponsorName').textContent = sponsor.name;
          if (sponsor.logoUrl || sponsor.logoUrlMedium) {
            const logo = document.getElementById('sponsorLogo');
            logo.src = sponsor.logoUrlMedium || sponsor.logoUrl;
            logo.style.display = 'block';
          }
        }
      } catch (e) {
        console.error('Failed to load sponsor:', e);
      }
    }

    // Load immediately
    loadSponsor();

    // Listen for updates from main process
    window.tvBox.onSponsorUpdate((sponsor) => {
      if (sponsor) {
        document.getElementById('sponsorName').textContent = sponsor.name;
        if (sponsor.logoUrl || sponsor.logoUrlMedium) {
          const logo = document.getElementById('sponsorLogo');
          logo.src = sponsor.logoUrlMedium || sponsor.logoUrl;
          logo.style.display = 'block';
        }
      }
    });
  </script>
</body>
</html>
